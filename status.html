<h4>help-wanted issues:</h4>

<ul id="issues">Loading issues…</ul>
<script>
fetch("https://api.github.com/repos/open-atmos/PySDM/issues?labels=help+wanted&per_page=100")
  .then(r => {
    if (!r.ok) throw new Error("GitHub API error: " + r.status);
    return r.json();
  })
  .then(issues => {
    document.getElementById("issues").innerHTML = issues
      .filter(i => !i.pull_request)
      .map(i => `<li><a href="${i.html_url}">#${i.number}: ${
        i.title.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      }</a></li>`)
      .join("") || "<li>No matching issues found.</li>";
  })
  .catch(() => {
    document.getElementById("issues").textContent = "Could not load issues.";
  });
</script>
